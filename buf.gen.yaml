version: v1
managed:
  enabled: true
  go_package_prefix:
    default: "github.com/scalekit-inc/scalekit-sdk-go/v2/pkg/grpc"
    except:
      - buf.build/googleapis/googleapis
      - buf.build/grpc-ecosystem/grpc-gateway
      - buf.build/bufbuild/protovalidate
  # scalekit/v1/auth/auth.proto and scalekit/v1/auth/passwordless.proto share a
  # directory but are distinct Protobuf packages, and since proto v0.1.141.0 both
  # declare a ResendPasswordlessRequest message with different fields. Managed
  # mode derives go_package from the file's directory, so by default both
  # generate into one Go package (pkg/grpc/scalekit/v1/auth) and the message is
  # redeclared, which fails to compile. Pin passwordless to its own Go package —
  # this only takes effect because the plugins below use module= rather than
  # paths=source_relative, so the output path follows go_package.
  override:
    GO_PACKAGE:
      scalekit/v1/auth/passwordless.proto: "github.com/scalekit-inc/scalekit-sdk-go/v2/pkg/grpc/scalekit/v1/auth/passwordless"
plugins:
  - plugin: go
    opt: module=github.com/scalekit-inc/scalekit-sdk-go/v2/pkg/grpc
    out: pkg/grpc
  - plugin: connect-go
    opt: module=github.com/scalekit-inc/scalekit-sdk-go/v2/pkg/grpc
    out: pkg/grpc
    
types:
  include:
    - scalekit.v1.errdetails
    - scalekit.v1.connections
    - scalekit.v1.domains
    - scalekit.v1.organizations
    - scalekit.v1.directories
    - scalekit.v1.users
    - scalekit.v1.auth
    - scalekit.v1.auth.passwordless
    - scalekit.v1.auditlogs
    - scalekit.v1.events
    - scalekit.v1.sessions
    - scalekit.v1.roles
    - scalekit.v1.auth.webauthn
    - scalekit.v1.clients
    - scalekit.v1.tokens
    - scalekit.v1.clients
