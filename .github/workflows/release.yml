# Vendored from scalekit-sdks-wrapper/tools/release/templates/workflows (generate.py).
# Edit there and run `make release-tool-sync`; do not edit this file in place.
#
# Releases github.com/scalekit-inc/scalekit-sdk-go/v2 (the tag is the release).
#
# Started with a version, by the /sdk or /sdk-release workflow in scalekit-sdks-wrapper after the
# release PR (version bump + CHANGELOG section) has merged, or by a maintainer from the Actions tab:
#
#   validate ──▶ ci (build.yml) ──▶ prepare ──▶ publish [environment: release]
#
# `publish` waits for a human approval on the `release` environment; the person who started the
# run cannot approve it. Registry credentials and the release app key exist only there.
# dry_run=true rehearses everything except tagging and publishing.
#
# Go has no registry upload: creating the tag publishes the module, and proxy.golang.org
# caches it permanently. The tag is created only by the release app, after approval.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, must match the source and have a CHANGELOG section)"
        required: true
        type: string
      dry_run:
        description: "Rehearse: run every step except tagging and publishing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, tag and CHANGELOG
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Real releases run from main only; use dry_run on other branches."; exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version (X.Y.Z)"; exit 1
          fi
          source_version="$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("core.go").read_text()
          print(re.search(r'^\s*sdkVersionNumber\s*=\s*"([^"]+)"', text, re.M).group(1))
          PY
          )"
          if [ "$source_version" != "$VERSION" ]; then
            echo "::error::Source says $source_version, not $VERSION. Merge the release PR first."; exit 1
          fi
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists."; exit 1
          fi
          latest="$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not ahead of the latest tag v$latest."; exit 1
          fi
          mkdir -p release-meta
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-meta/section.md
          if [ ! -s release-meta/section.md ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::CHANGELOG.md has no section for $VERSION."; exit 1
            fi
            echo "_Rehearsal: CHANGELOG.md has no section for ${VERSION}._" > release-meta/section.md
          fi
          {
            cat release-meta/section.md
            echo
            echo "### Install / upgrade"
            echo
            echo '```bash'
            cat <<INSTALL
          go get github.com/scalekit-inc/scalekit-sdk-go/v2@v${VERSION}
          INSTALL
            echo '```'
            if [ -n "$latest" ]; then
              echo
              echo "**Full diff:** https://github.com/${REPO}/compare/v${latest}...v${VERSION}"
            fi
          } > release-meta/notes.md
          cat release-meta/notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-meta-${{ inputs.version }}
          path: release-meta/
          if-no-files-found: error
          retention-days: 30

  ci:
    name: ci
    needs: validate
    # Must cover every permission build.yml's jobs request.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    uses: ./.github/workflows/build.yml
    secrets: inherit

  prepare:
    name: prepare
    needs: [validate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check module major version
        run: |
          major="${VERSION%%.*}"
          module="$(sed -n 's/^module //p' go.mod)"
          case "$module" in
            */v"$major") echo "module $module matches v$major" ;;
            *) echo "::error::version ${VERSION} does not match module path ${module}"; exit 1 ;;
          esac

  publish:
    name: publish
    needs: [validate, prepare]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pkg.go.dev/github.com/scalekit-inc/scalekit-sdk-go/v2@v${{ inputs.version }}
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-meta-${{ inputs.version }}
          path: release-meta
      - name: Release app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          existing="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already exists at ${existing}, not ${GITHUB_SHA}"; exit 1
            fi
            echo "${TAG} already exists at ${GITHUB_SHA}; continuing"
          else
            gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"; exit 0
          fi
          flags=(--verify-tag --title "${TAG}" --notes-file release-meta/notes.md)
          case "${VERSION}" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          gh release create "${TAG}" --repo "${REPO}" "${flags[@]}"
      - name: Verify on the Go module proxy
        run: |
          for _ in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://proxy.golang.org/github.com/scalekit-inc/scalekit-sdk-go/v2/@v/${TAG}.info")"
            if [ "$code" = "200" ]; then echo "proxy.golang.org serves ${TAG}"; exit 0; fi
            sleep 15
          done
          echo "::error::proxy.golang.org does not serve ${TAG} after 5 minutes"; exit 1
